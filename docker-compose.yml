name: homebase-expenses
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-homebase_expenses}
      POSTGRES_USER: ${DB_USER:-homebase_expenses_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - expenses_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  expenses_pgdata:
